<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Viajes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="container">

        <h1>Planificador de Viajes</h1>

        <form id="viajeForm">

            <label for="destino">Destino:</label>
            <select id="destino" required>
                <option value="">Selecciona un destino</option>
                <option value="Ciudad de México">Ciudad de México</option>
                <option value="Cancún">Cancún</option>
                <option value="Monterrey">Monterrey</option>
                <option value="Guadalajara">Guadalajara</option>
                <option value="Oaxaca">Oaxaca</option>
            </select>

            <label for="fecha">Fecha del viaje:</label>
            <input type="date" id="fecha" required>

            <label for="transporte">Transporte:</label>
            <select id="transporte" required>
                <option value="">Selecciona transporte</option>
                <option value="autobus">Autobús</option>
                <option value="avion">Avión</option>
                <option value="tren">Tren</option>
                <option value="auto">Automóvil</option>
            </select>

            <label for="alojamiento">Alojamiento:</label>
            <select id="alojamiento" required>
                <option value="">Selecciona alojamiento</option>
                <option value="hotel">Hotel</option>
                <option value="hostal">Hostal</option>
                <option value="airbnb">Airbnb</option>
            </select>

            <label for="personas">Número de personas:</label>
            <input
                type="number"
                id="personas"
                min="1"
                value="1"
                required
            >

            <button type="submit">
                Registrar viaje
            </button>

        </form>

        <section class="resultado">

            <h2>Itinerario</h2>

            <div id="itinerario">
                <p>No hay viajes registrados.</p>
            </div>

            <div class="total">
                <strong>Costo total:</strong>
                <span id="costoTotal">$0</span>
            </div>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>
</html>
